<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>toKIT</title>
<meta name="description" content="Drop a file, pick what should happen, done. Free tools for PDFs, images, Office files, audio and text. No ads, no account, and your files never leave your device.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/canvas.css">
</head>
<body>
<div class="grid" id="grid-fine" aria-hidden="true"></div>
<div class="grid" id="grid-coarse" aria-hidden="true"></div>

<main class="world" id="world">
  <h1 class="big-title" id="big-title">
    <span>Drop it.</span>
    <span><span class="underline">Fix<svg viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true"><path d="M3 13 C 40 5, 80 17, 120 9 S 180 6, 197 11" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/></svg></span> it.</span>
  </h1>

  <nav class="reel" id="reel" aria-label="All tools"></nav>

  <img class="korbi" id="korbi" alt="" aria-hidden="true">
  <section class="terminal" id="terminal" tabindex="0" role="button" aria-label="Drop a file here or press Enter to choose one">
    <div class="terminal-bar" aria-hidden="true"><i></i><i></i><i></i><span>you@tokit: ~</span></div>
    <div class="terminal-body" id="terminal-body" aria-live="polite"></div>
  </section>
  <div class="selection" id="selection" aria-hidden="true"><div class="selection-box"><i></i><i></i><i></i><i></i></div><span class="selection-label">drop to open</span></div>

  <section class="region region-options" id="options" aria-label="What you can do with your file"></section>
  <section class="region region-tool" id="tool" aria-label="Tool"></section>
</main>

<p class="site-footer">© 2026 Korbi<span class="footer-long">&nbsp;· nothing leaves your device</span></p>
<nav class="hud" aria-label="Controls">
  <button class="hud-pill" id="back-pill" type="button" hidden>← <span>back</span></button>
  <a class="hud-pill github-pill" href="https://github.com/K0RBI02/toKIT"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.7 5.4-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg><span>GitHub</span></a>
  <span class="hud-pill zoom-pill" id="zoom-pill">100%</span>
</nav>

<script src="js/core.js"></script>
<script src="js/tools/pdf.js"></script>
<script src="js/tools/pdf-more.js"></script>
<script src="js/tools/image.js"></script>
<script src="js/tools/image-more.js"></script>
<script src="js/tools/office.js"></script>
<script src="js/tools/audio.js"></script>
<script src="js/tools/video.js"></script>
<script src="js/tools/text.js"></script>

</body>
</html>
