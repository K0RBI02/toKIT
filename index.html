<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>toKIT</title>
<meta name="description" content="Drop a file, pick what should happen, done. Free tools for PDFs, images, Office files, audio and text. No ads, no account, and your files never leave your device.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/canvas.css">
</head>
<body>
<div class="grid" id="grid-fine" aria-hidden="true"></div>
<div class="grid" id="grid-coarse" aria-hidden="true"></div>

<main class="world" id="world">
  <h1 class="big-title" id="big-title">
    <span>Drop it.</span>
    <span><span class="underline">Fix<svg viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true"><path d="M3 13 C 40 5, 80 17, 120 9 S 180 6, 197 11" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/></svg></span> it.</span>
  </h1>

  <div class="flow" id="flow" aria-hidden="true">
    <div class="flow-step">
      <div class="flow-tile"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 10 C 40 11, 52 10, 62 10 L 80 28 C 79 48, 81 70, 80 90 C 60 91, 42 89, 25 90 C 26 70, 24 40, 24 10 Z"/><path d="M62 10 C 61 16, 62 22, 62 28 C 68 29, 74 28, 80 28"/><path d="M52 44 L 52 74 M 40 62 L 52 74 L 64 62" stroke="var(--accent)"/></svg></div>
      <span>drop it</span>
    </div>
    <svg class="flow-arrow" viewBox="0 0 100 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 24 C 30 12, 60 30, 90 18 M 78 8 L 92 18 L 80 30"/></svg>
    <div class="flow-step">
      <div class="flow-tile"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12 L 44 11 L 45 44 L 13 45 Z M 56 11 L 88 12 L 87 45 L 55 44 Z M 13 56 L 45 55 L 44 88 L 12 87 Z"/><path d="M55 56 L 88 55 L 89 88 L 56 89 Z" stroke="var(--accent)"/></svg></div>
      <span>pick one</span>
    </div>
    <svg class="flow-arrow" viewBox="0 0 100 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 C 34 30, 62 8, 90 22 M 78 12 L 92 22 L 78 32"/></svg>
    <div class="flow-step">
      <div class="flow-tile"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M50 10 C 74 9, 91 26, 90 50 C 91 74, 74 91, 50 90 C 26 91, 9 74, 10 50 C 9 26, 26 9, 50 10 Z"/><path d="M30 52 L 44 66 L 72 36" stroke="var(--accent)" stroke-width="7"/></svg></div>
      <span>fix it</span>
    </div>
  </div>

  <img class="korbi" id="korbi" alt="" aria-hidden="true">
  <section class="terminal" id="terminal" tabindex="0" role="button" aria-label="Drop a file here or press Enter to choose one">
    <div class="terminal-bar" aria-hidden="true"><i></i><i></i><i></i><span>you@tokit: ~</span></div>
    <div class="terminal-body" id="terminal-body" aria-live="polite"></div>
  </section>
  <div class="selection" id="selection" aria-hidden="true"><div class="selection-box"><i></i><i></i><i></i><i></i></div><span class="selection-label">drop to open</span></div>

  <section class="region region-options" id="options" aria-label="What you can do with your file"></section>
  <section class="region region-tool" id="tool" aria-label="Tool"></section>
</main>

<p class="site-footer">© 2026 Korbi<span class="footer-long">&nbsp;· nothing leaves your device</span></p>
<nav class="hud" aria-label="Controls">
  <button class="hud-pill" id="back-pill" type="button" hidden>← <span>back</span></button>

  <span class="hud-pill zoom-pill" id="zoom-pill">100%</span>
</nav>

<script src="js/core.js"></script>
<script src="js/tools/pdf.js"></script>
<script src="js/tools/image.js"></script>
<script src="js/tools/office.js"></script>
<script src="js/tools/audio.js"></script>
<script src="js/tools/text.js"></script>
<script src="js/tools/generate.js"></script>
<script src="js/tools/convert.js"></script>
<script src="js/icons.js"></script>
<script src="js/korbi.js"></script>
<script src="js/app.js"></script>
</body>
</html>
